[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "deermind"
version = "0.1.0"
description = "DeerMind M1 application"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.3",
  "temporalio==1.36.1",
  "sqlalchemy[asyncio]==2.1.8",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "pwdlib[argon2]==0.4.2",
  "nats-py==2.16.0",
  "pydantic-ai-slim[openai,temporal]==2.68.0",
  "openai==3.51.0",
]

[project.scripts]
deermind-api = "deermind.entrypoints.api.app:main"
deermind-worker = "deermind.entrypoints.worker.main:main"
deermind-probe = "deermind.entrypoints.maintenance.probe:main"
deermind-database = "deermind.entrypoints.maintenance.database:main"
deermind-rebuild = "deermind.entrypoints.maintenance.rebuild:main"
deermind-messaging = "deermind.entrypoints.maintenance.messaging:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deermind"]

[tool.hatch.build.targets.wheel.force-include]
migrations = "deermind/_migrations"

[tool.uv]
required-version = "==0.13.8"
