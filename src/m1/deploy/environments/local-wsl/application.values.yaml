images:
  server: deermind/server:e03-task-text-r1
  client: deermind/client:e03-task-text-r1
nodeSelector:
  kubernetes.io/hostname: deermind-m1
filesClaim: deermind-files
database:
  host: deermind-postgres
  port: 5432
  name: deermind_task_text
  existingSecret: deermind-postgres
temporal:
  address: deermind-temporal-frontend:7233
  namespace: dm-local-wsl
  taskQueue: dm.local-wsl.application
messaging:
  address: nats://deermind-nats:4222
  deployment: local-wsl
  existingSecret: deermind-nats
materialAssistant:
  enabled: true
  model: deepseek-flash
  existingSecret: deermind-material-model

auth:
  origins:
    - http://127.0.0.1:5184
    - http://localhost:5184
  localHttp: true
  trustedProxies: [10.42.0.0/24]
