worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    client_max_body_size 2m;
    error_page 413 = @body_too_large;
    location @body_too_large {
      default_type application/json;
      add_header Cache-Control no-store always;
      return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds the allowed size.","issues":[],"retryable":false}}';
    }
    root /usr/share/nginx/html;
    location = / { return 302 /student/; }
    location = /favicon.ico { access_log off; return 204; }
    location = /health/live { access_log off; return 200 'ok'; }
    # 正式API保留完整路径；代理覆盖来源地址，不接受浏览器伪造的转发头。
    location ~ "^/api/m1/file-uploads/[0-9a-fA-F-]{36}/content$" {
      client_max_body_size 512m;
      client_body_timeout 60s;
      proxy_http_version 1.1;
      proxy_request_buffering off;
      proxy_read_timeout 1200s;
      proxy_pass http://{{ .Release.Name }}-api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/m1/ {
      proxy_pass http://{{ .Release.Name }}-api:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location = /ws {
      proxy_pass http://{{ .Release.Name }}-api:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
    location /api/ {
      proxy_pass http://{{ .Release.Name }}-api:8000/;
      proxy_set_header Host $host;
    }
    location /assets/ { try_files $uri =404; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /student/ { try_files $uri $uri/ /student/index.html; }
    location / { return 404; }
  }
}
