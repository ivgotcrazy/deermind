worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = / { return 302 /student/; }
    location = /favicon.ico { access_log off; return 204; }
    location = /health/live { access_log off; return 200 'ok'; }
    location /api/ {
      proxy_pass http://{{ .Release.Name }}-api:8000/;
      proxy_set_header Host $host;
    }
    location /assets/ { try_files $uri =404; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /student/ { try_files $uri $uri/ /student/index.html; }
    location / { return 404; }
  }
}
